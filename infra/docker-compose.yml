# Local/production stack: ingest (TDX polling) → OTP (routing) ← api (public HTTP API).
#   cp .env.example .env            # add TDX credentials
#   infra/scripts/fetch-data.sh     # GTFS + OSM → data/
#   infra/scripts/build-graph.sh    # OTP graph → data/otp/graph.obj
#   docker compose -f infra/docker-compose.yml up -d
name: twcommute

services:
  ingest:
    build:
      context: ..
      dockerfile: apps/ingest/Dockerfile
    env_file: ../.env
    environment:
      PUBLIC_BASE_URL: http://ingest:8081
      DATA_DIR: /data
    volumes:
      - ../data:/data
    ports:
      - "8081:8081"
    # Healthy once ingest lists its feeds and every YouBike feed (docks and availability) has loaded:
    # OTP reads the docks when it starts and does not retry, so it waits for this (see otp below).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:8081/health').then((r) => r.json())
          .then((b) => process.exit(b.feeds.length > 0 && b.feeds.every((f) => !f.feed.startsWith('bike-') || f.lastSuccessAt) ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      start_period: 5m
      retries: 60
    restart: unless-stopped

  otp:
    image: docker.io/opentripplanner/opentripplanner:2.10.0
    command: ["--load", "--serve"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx${OTP_HEAP:-12g}"
    volumes:
      - ../data/otp:/var/opentripplanner
    ports:
      - "8080:8080"
    depends_on:
      ingest:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: ../.env
    environment:
      OTP_URL: http://otp:8080/otp/gtfs/v1
      INGEST_URL: http://ingest:8081
    ports:
      - "3000:3000"
    depends_on:
      - otp
      - ingest
    restart: unless-stopped

  # One-off graph builds: docker compose -f infra/docker-compose.yml run --rm otp-build ...
  otp-build:
    image: docker.io/opentripplanner/opentripplanner:2.10.0
    profiles: ["build"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx${OTP_BUILD_HEAP:-24g}"
    volumes:
      - ../data/otp:/var/opentripplanner
